<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran GoSmart IND</title>
    
    <!-- Mengambil font dari internet -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- INI CARA FLASK MEMANGGIL FILE CSS DARI FOLDER STATIC -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>LES PRIVATE</h2>
    <h2>Go Smart Indonesia</h2>
    <p class="subtitle">Silakan lengkapi formulir pendaftaran di bawah ini</p>

    <!-- ... (Isi Form Anda tetap sama seperti sebelumnya, tidak ada yang berubah) ... -->
    <form action="/proses_daftar" method="POST">
        
        <div class="form-section">
            <span class="form-section-title">Data Siswa</span>
            <label>Nama Lengkap Siswa</label>
            <input type="text" name="siswa" placeholder="Contoh: Budi Santoso" required>

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Jenis Kelamin</label>
                    <select name="jk" required>
                        <option value="">Pilih</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Kelas</label>
                    <input type="text" name="kls" placeholder="Contoh: 10 SMA" required>
                </div>
            </div>

            <label>Asal Sekolah</label>
            <input type="text" name="sekolah" placeholder="Nama sekolah saat ini" required>
            
            <label>Alamat Lengkap</label>
            <input type="text" name="alamat" placeholder="Alamat rumah tinggal" required>
        </div>

        <div class="form-section">
            <span class="form-section-title">Program Akademik</span>
            <label>Mata Pelajaran yang Diambil</label>
            <input type="text" name="mapel" placeholder="Contoh: Matematika & Fisika" required>
        </div>

        <div class="form-section">
        <span class="form-section-title">Data Orang Tua / Wali</span>
        <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Nama Orang Tua / Wali</label>
                    <input type="text" name="ortu" required>
                </div>
                <div style="flex: 1;">
                    <label>Nomor HP Aktif (WhatsApp)</label>
                    <input type="number" name="hp" placeholder="08123..." required>
                </div>
            </div>

        <button type="submit">Konfirmasi Pendaftaran</button>
    </form>

    <div class="footer-link">
        <!-- <a href="/daftar_siswa">Lihat Daftar Siswa &rarr;</a> -->
    </div>
</div>

</body>
</html>
